<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | CarbonTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f7f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #198754;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #126b40;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #198754;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <h2>👤 Edit Profile</h2>

        <p class="subtitle">
            Update your CarbonTrack account details
        </p>

        <form id="profileForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">Save Changes</button>

        </form>

        <a href="/" class="cancel">
            ← Back to Dashboard
        </a>

        <p id="message"></p>

    </div>

    <script>

        // Get logged-in user details
        let user = JSON.parse(
            sessionStorage.getItem("carbonUser") || "{}"
        );

        // Display existing details
        document.getElementById("name").value =
            user.name || "";

        document.getElementById("email").value =
            user.email || "";

        // Save updated profile
        document.getElementById("profileForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();

                user.name = document
                    .getElementById("name")
                    .value.trim();

                user.email = document
                    .getElementById("email")
                    .value.trim();

                sessionStorage.setItem(
                    "carbonUser",
                    JSON.stringify(user)
                );

                document.getElementById("message")
                    .textContent =
                    "Profile updated successfully!";

            });

    </script>

</body>
</html>
